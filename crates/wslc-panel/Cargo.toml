[package]
name = "wslc-panel"
version.workspace = true
license.workspace = true
publish = false
description = "WSL 容器（wslc）管理面板 —— Rust + GPUI"
# gpui-kit 依赖的 gpui-pre 是 edition 2024。
edition = "2024"
rust-version = "1.85"
default-run = "wslc-panel"

[[bin]]
name = "wslc-panel"
path = "src/main.rs"

[dependencies]
wslc-core = { workspace = true }
# 不依赖 GPUI 的那一半（偏好 / 状态 / 列宽 / 预设 / 纯函数）。
# 拆出去是为了 CI：纯逻辑单测不必再编译并链接整棵 GPUI 依赖树。
wslc-panel-core = { workspace = true }
# 一个依赖即包含 GPUI + gpui-base + gpui-component + 默认图标集。
gpui-kit = { workspace = true }
# serde / serde_json / anyhow 跟着 prefs.rs、state.rs 一起搬去 wslc-panel-core 了
# —— 这个 crate 里已经没有直接用到它们的地方。
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
