[package]
name = "wslc-panel"
version.workspace = true
license.workspace = true
publish = false
description = "WSL 容器（wslc）管理面板 —— Rust + GPUI"
# gpui-kit 依赖的 gpui-pre 是 edition 2024。
edition = "2024"
rust-version = "1.85"
default-run = "wslc-panel"
# 把图标与 VERSIONINFO 嵌进 exe（见 build.rs）。不加它，Windows 只能给这个
# 程序画一张白纸 —— 快捷方式、任务栏、Alt+Tab 全都没有图标。
build = "build.rs"

[[bin]]
name = "wslc-panel"
path = "src/main.rs"

# 只在编译期用：它负责**找到** rc.exe（MSVC 的 rc.exe 不在 PATH 里），
# 我们不自己调 —— 本机没有 Windows SDK，无从验证调用写对没有。
# ⚠️ 加它会让 Cargo.lock 里 `name = "wslc-panel"` 的 dependencies 多一项，
# 而所有 cargo 步骤都带 `--locked`（AGENTS.md §3）。版本 3.0.12 本来就在锁里
# （gpui 的 build-dep 带的），所以只是多一条边、不引入新 crate。
[build-dependencies]
embed-resource = "3.0"

[dependencies]
wslc-core = { workspace = true }
# 不依赖 GPUI 的那一半（偏好 / 状态 / 列宽 / 预设 / 纯函数）。
# 拆出去是为了 CI：纯逻辑单测不必再编译并链接整棵 GPUI 依赖树。
wslc-panel-core = { workspace = true }
# 一个依赖即包含 GPUI + gpui-base + gpui-component + 默认图标集。
gpui-kit = { workspace = true }
# serde / serde_json / anyhow 跟着 prefs.rs、state.rs 一起搬去 wslc-panel-core 了
# —— 这个 crate 里已经没有直接用到它们的地方。
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# 只为了 SQL 编辑器的自动补全（`CompletionProvider` 的签名里就是
# `lsp_types::CompletionItem`）。见根 `Cargo.toml` 里的说明。
lsp-types = { workspace = true }
