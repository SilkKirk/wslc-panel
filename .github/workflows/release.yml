name: Release

# 触发方式：
#   - 推一个 v* 标签（例如 v0.1.0）→ 编译 + 打包 + 建 Release
#   - 手动 workflow_dispatch：
#       release_tag 留空 → 只编译 + 上传 Artifact（不开 Release）
#       release_tag 填 v0.1.0 → 编译 + 打包，并为该标签建 Release
#
#     为什么还需要"填 release_tag"这条路径：
#     ① 给**已经存在**的标签补发 Release / 补资产（重新出包也走它）；
#     ② `git push` 不通、标签只能从别处建的时候。
#     ⚠️ 但它**不是**"用 API 建标签时的必备步骤" —— 早先这里写着
#     "用 REST API 建 tag 只会触发 create 事件、不会触发 push"，那条**是错的**：
#     实测（v0.9.2）用 POST /git/tags + POST /git/refs 建完标签 3 秒内，
#     GitHub 自己就起了一个 `event=push` 的 run。所以正确姿势是**先等一分钟**
#     看有没有自己起，有就别再手动 dispatch —— 否则同一个标签上两个 run 并行，
#     会撞出 `422 Release.tag_name already exists`（详见 AGENTS §4）。
#
# 产物是**单文件 exe**：GPUI 走 D3D11，不依赖 WebView2 或任何运行时。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布到的标签（留空则只出 Artifact，不建 Release）"
        type: string
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BIN_NAME: wslc-panel

jobs:
  package:
    name: 编译并打包 Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 与 target
        uses: Swatinem/rust-cache@v2
        with:
          # release 与 debug 的缓存分开，避免互相挤掉。
          key: release

      - name: 环境信息
        shell: pwsh
        run: |
          rustc --version
          cargo --version
          # 注意：这里**不能用 `where.exe rc.exe || echo ...`**。
          # where.exe 找不到文件时返回 1，而 PowerShell 不会因为后面跑了一个
          # cmdlet 就把 $LASTEXITCODE 清零 —— 步骤最后仍会以 1 退出，
          # 于是一个纯信息步骤把整个构建搞挂了（CI 上真实踩过）。
          # 用 Get-Command 不触碰 $LASTEXITCODE，并且显式 exit 0。
          $rc = Get-Command rc.exe -ErrorAction SilentlyContinue
          if ($rc) {
            Write-Output "rc.exe: $($rc.Source)"
          } else {
            Write-Output "rc.exe 不在 PATH —— Rust 的 embed-resource 会自行从 Windows SDK 定位，通常不影响构建"
          }
          exit 0

      - name: 纯逻辑测试（出包前自己先验一遍）
        # 现在"main 上 CI 绿了才打标签"是靠人的纪律；发布流程本身不验证。
        # 和 ci.yml 的 core 任务同一条命令（同样是 `--exclude wslc-panel`：
        # 不为了几个断言把整棵 GPUI 链接一遍）。
        run: cargo test --workspace --exclude wslc-panel --locked --profile ci

      - name: 编译 release
        env:
          # 注入提交号，让程序自己报出"构建自哪个提交" ——
          # 用户据此确认下载到的到底是不是新版。
          WSLC_PANEL_BUILD_SHA: ${{ github.sha }}
        # `--locked`：本机没有 cargo，改 Cargo.toml 后无法在本地重新生成锁文件。
        # 不加它，cargo 会自己解析一份新依赖集来出包 —— 那份依赖集**没有记录
        # 在仓库里**，于是"这个 tag 对应哪个可执行文件"就不再可复现了。
        run: cargo build -p wslc-panel --release --locked

      - name: 确认 exe 存在
        shell: pwsh
        run: |
          $exe = "target/release/$env:BIN_NAME.exe"
          if (-not (Test-Path $exe)) { throw "没有产出 $exe" }
          $item = Get-Item $exe
          "exe 大小：{0:N2} MB" -f ($item.Length / 1MB)
          # 记录大小到日志，便于对比不同版本
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| 项目 | 值 |`n|---|---|`n| exe | ``$exe`` |`n| 大小 | $([math]::Round($item.Length/1MB,2)) MB |"

      - name: 准备产物（exe + zip）
        shell: pwsh
        run: |
          $refTag   = ("${{ github.ref_type }}" -eq "tag")
          $inputTag = "${{ inputs.release_tag }}".Trim()
          $tag = if ($refTag) { "${{ github.ref_name }}" }
                 elseif ($inputTag) { $inputTag }
                 else { "dev-$("${{ github.sha }}".Substring(0,7))" }
          # 是否要建 Release：标签触发，或手动指定了 release_tag。
          $publish = $refTag -or ($inputTag -ne "")
          Write-Output "tag=$tag  publish=$publish"

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 主产物：**裸 exe**。单文件程序没必要让用户先解压。
          $exeName = "$env:BIN_NAME.exe"
          Copy-Item "target/release/$exeName" "dist/$exeName" -Force

          # 附带 zip：里面多一份 README 与 docs，方便归档/离线分发。
          $zip = "dist/$env:BIN_NAME-$tag-windows-x64.zip"
          Compress-Archive -Path "target/release/$env:BIN_NAME.exe", "README.md", "docs" -DestinationPath $zip -Force

          "EXE=dist/$exeName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP=$zip"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PUBLISH=$publish"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem dist | Select-Object Name, Length
          exit 0

      - name: 编译安装包（Inno Setup）
        # 只在 vX.Y.Z 标签上编：手动 dispatch 且没填 release_tag 时 `$tag` 是
        # `dev-<sha>`，不是数字版本号，Inno 的 AppVersion 要的是数字。
        if: startsWith(env.TAG, 'v')
        shell: pwsh
        # runner 镜像自带 InnoSetup 6.7.1（实测 2022/2025/2025-vs2026 的 readme），
        # 所以这里不下载任何东西；脚本里也留了"找不到就给一句能照做的话"的分支。
        run: ./scripts/build-installer.ps1 -Version "$env:TAG" -ExeSource "$env:EXE" -OutputDir dist

      - name: 上传 Artifact
        # 无条件上传：打标签时它和 Release 并存，
        # 手动触发时它就是唯一的产物出口。
        # （早先这里写了 `github.ref_type != 'tag' || inputs.upload_artifact`，
        #   结果打标签时反而拿不到 artifact。）
        uses: actions/upload-artifact@v4
        with:
          name: wslc-panel-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: 创建 Release
        # 用 runner 自带的 gh CLI，避免引入第三方 action。
        # 两种触发方式都归一到 PUBLISH 这个环境变量上。
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @'
          Windows x64。三种取法，按需选一个：

          | 文件 | 用途 |
          |---|---|
          | `wslc-panel-<tag>-setup-x64.exe` | **安装包**（推荐）：per-user 安装，不弹 UAC，带开始菜单快捷方式与卸载项 |
          | `wslc-panel.exe` | **单文件绿色版**：直接双击运行，无需解压、无需安装 |
          | `wslc-panel-<tag>-windows-x64.zip` | 同一程序的压缩包，多带了 README 与 docs，归档/离线分发用 |

          **前置条件**：Windows 上装有 WSL 3.0 以上版本（提供 `wslc.exe`）。
          若安装在非默认路径，请设置环境变量 `WSLC_PATH` 指向它。

          **数据来源**：全部通过 `wslc.exe` 子进程 + `--format json`，
          不依赖 Docker Desktop，也不需要 WebView2。

          > 分享文件请只分享 exe / setup，不要分享整个 `%LOCALAPPDATA%\wslc-panel`
          > 目录 —— 里面的 `db-credentials.json` 存着数据库账号（明文密码）。

          ### 打不开怎么办

          发布版是 Windows 子系统程序，**不会**弹控制台窗口。日志在这里：

          ```
          %LOCALAPPDATA%\wslc-panel\logs\wslc-panel.log
          ```

          正常启动最后一行是 `窗口已打开`。如果只有 `启动` 而没有它，
          多半是显卡/驱动问题 —— GPUI 走 Direct3D 11，需要 D3D11 及以上。
          '@
          $notes | Out-File -FilePath NOTES.md -Encoding utf8

          # 资产清单：setup 只在打了 v 标签时才编得出来（见上一步的 if），
          # 所以这里按"存在就带上"来拼，不要在手动 dispatch 的 dev 构建上炸。
          $assets = @($env:EXE, $env:ZIP)
          $setup = "dist/wslc-panel-$env:TAG-setup-x64.exe"
          if (Test-Path $setup) { $assets += $setup }
          else { Write-Output "没有安装包（tag=$env:TAG 不是 vX.Y.Z？）—— 只发 exe + zip" }

          # 幂等：Release 可能已经存在 —— 比如同一个标签重跑工作流，
          # 或者用它给已存在的标签补资产。直接 `gh release create` 会报
          # "a release with the same tag name already exists" 而失败。
          gh release view "$env:TAG" > $null 2>&1
          $exists = ($LASTEXITCODE -eq 0)

          if ($exists) {
            Write-Output "Release $env:TAG 已存在 → 覆盖资产并更新说明"
            gh release upload "$env:TAG" $assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "上传资产失败" }
            gh release edit "$env:TAG" --title "$env:TAG" --notes-file NOTES.md
          } else {
            Write-Output "创建 Release $env:TAG"
            # 先传裸 exe（GitHub 会把它作为主要下载项），再传 zip / setup。
            gh release create "$env:TAG" $assets --title "$env:TAG" --notes-file NOTES.md
            if ($LASTEXITCODE -ne 0) {
              # ⚠️ 竞态（v0.9.2 实测踩到，跑红过一次）：用 API 建标签时 GitHub
              # **会**同时起一个 `push: tags` 的 run（见 AGENTS §4 的更正），
              # 于是同一个标签上并行跑两个 run —— push 那个先建出 Release，
              # 而我们上面 `gh release view` 查的时候它还没出现，走到这里就必然
              # 撞 `422 ... Release.tag_name already exists`，整个 job 变红
              # （发布其实是成功的，红叉是假的）。
              # 所以创建失败**不能直接放弃**：退到幂等那条路，把资产覆盖上去。
              Write-Output "创建失败（多半是并行的 push run 已经建好了）→ 退到覆盖资产 + 更新说明"
              gh release upload "$env:TAG" $assets --clobber
              if ($LASTEXITCODE -ne 0) { throw "上传资产失败" }
              gh release edit "$env:TAG" --title "$env:TAG" --notes-file NOTES.md
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "发布失败" }
          Write-Output "完成：$env:TAG"
