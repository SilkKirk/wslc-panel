name: Format

# 为什么要单独一个手动工作流：
#   开发这台机器上没有 Rust 工具链（也就没有 rustfmt），
#   唯一能拿到权威格式化结果的地方就是 CI。
#   这里跑 `cargo fmt --all` 并把结果提交回来，等价于"在本地跑一次 cargo fmt"。
#
# 用法：Actions → Format → Run workflow。
#   把 commit 关掉可以只查看会改什么（不改仓库）。

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "是否把格式化结果提交回仓库"
        type: boolean
        default: true

# 需要写权限才能推回去。
# 注意：用 GITHUB_TOKEN 推送**不会**再触发其它工作流，所以不会形成循环。
permissions:
  contents: write

jobs:
  fmt:
    name: cargo fmt
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust（只要 rustfmt）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 运行 cargo fmt
        run: cargo fmt --all

      - name: 查看改动
        shell: pwsh
        run: |
          git --no-pager diff --stat
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## cargo fmt 改动`n`n``````n$((git --no-pager diff --stat | Out-String))`n``````"

      - name: 提交并推送
        if: inputs.commit
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # ⚠️ **不要用 `git add -A`**（AGENTS.md §5 明令禁止）。
          #
          # 那个坑在本仓库踩过：`-A` 会把工作区里**一切**改动都提交进去 ——
          # 包括临时文件（`.tmp-msg*.txt`）、以及 `.gitattributes` 里
          # `eol=crlf` 那些文件因换行规范化产生的差异。
          # 2026-10-25 这一轮实测：`cargo fmt` 只该改 `.rs`，而 `-A`
          # 顺手把 `build-installer.ps1` / `wslc-panel.iss` /
          # `ChineseSimplified.isl` 三个文件的 blob 也从"历史遗留的 CRLF"
          # 规范成了 LF（内容一字未变，只是 git 的存储形态）—— 混进了一个
          # 名叫 `style: cargo fmt` 却改了安装脚本的提交里。
          #
          # 这里只收 `*.rs`：`cargo fmt` 的输出范围**就是**它们，
          # 多收任何一个文件都说明有别的东西混进来了。
          git add -- '*.rs'
          if (git diff --cached --quiet) {
            Write-Output "没有需要格式化的改动"
          } else {
            # 自查：这个提交里只能有 .rs 文件（`-A` 那种事故的守门）
            $staged = git diff --cached --name-only
            $nonRs = $staged | Where-Object { $_ -notmatch '\.rs$' }
            if ($nonRs) {
              Write-Output "::error title=fmt::暂存区里有非 .rs 文件，拒绝提交：$($nonRs -join ', ')"
              exit 1
            }
            Write-Output "将提交 $($staged.Count) 个文件："
            $staged | ForEach-Object { Write-Output "  $_" }
            git commit -m "style: cargo fmt"
            git push
            Write-Output "已提交格式化结果"
          }
