name: CI

# 本机没有 Rust 工具链，所以 CI 是唯一的编译验证通道。
#
# 设计要点：
# 1. `core` 任务先跑 —— 它不需要 GPU、不需要显示环境，2 分钟内就能给出
#    数据层的真实结论（UTF-16LE 解码、JSON Lines 解析、settings 注释保留……）。
# 2. `ui` 任务跑 `cargo check` 而不是 `cargo build` —— 依赖树才是耗时大头，
#    check 能拿到全部类型错误却省掉代码生成与链接，反馈快得多。
# 3. `fmt` / `clippy` 目前是**建议性**的（continue-on-error）：
#    代码是手写的、本机无法执行 rustfmt，先别让格式问题掩盖真正的编译错误。
# 4. `push` **只监听 `main`**（原先写的是 `["**"]`）。
#
#    原因：原来 `push: branches: ["**"]` 和 `pull_request:` 都在监听，
#    于是「推功能分支 + 开 PR」这套流程会**跑两遍**同一个提交 ——
#    push 一次、pull_request 一次，同样的 job 干两遍活。
#
#    功能分支现在只在开 PR 时跑。代价是"推上去就有反馈"没了，
#    但换来的是不再重复烧 CI 分钟数，而 main 的每次推送仍然照跑。

on:
  push:
    # 只有 main 的推送才跑；功能分支走 pull_request。
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: wslc-core 测试（纯逻辑，无需 GPU）
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 与 target
        uses: Swatinem/rust-cache@v2

      - name: 版本信息
        run: |
          rustc --version
          cargo --version

      - name: 跑数据层测试
        # 真机冒烟测试在没有 wslc 的 runner 上会自动跳过（见 tests/wslc_smoke.rs）。
        run: cargo test -p wslc-core -- --nocapture

  ui:
    name: wslc-panel 编译检查（GPUI）
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo 与 target
        uses: Swatinem/rust-cache@v2

      - name: 检查整个 workspace
        # 这是本项目的关键验证：GPUI 的 API 假设（异步闭包、ButtonVariants、
        # Styled 方法名……）只有真正编译过才算数。见 docs/SPIKE.md §2。
        run: cargo check --workspace --all-targets

      - name: 检查默认启动是否可用
        run: cargo check -p wslc-panel --bins

      - name: 跑 wslc-panel 自己的测试
        # ⚠️ 这一步不能省：`views.rs` / `app.rs` / `state.rs` 里的单测属于
        # **bin 的 test target**，而 `cargo check --all-targets` 只做类型检查、
        # **不会执行**。少了这一步，那些测试等于从没跑过。
        #
        # 这些测试都是纯逻辑（表格列宽、预设值、输入切分……），
        # 不创建窗口也不需要 GPU，所以能在 CI 上直接跑。
        run: cargo test -p wslc-panel --bins -- --nocapture

  lint:
    name: 格式与 clippy（只报告，不阻塞）
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存 cargo 与 target
        uses: Swatinem/rust-cache@v2

      # 本机没有 Rust 工具链，所以这里是唯一能拿到 rustfmt diff 的地方。
      # 输出同时进日志和 Step Summary，方便直接照抄回去。
      - name: rustfmt
        shell: pwsh
        run: |
          $out = (cargo fmt --all -- --check 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            Write-Output "::warning title=rustfmt::代码未通过 rustfmt 检查，需要运行 cargo fmt"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## rustfmt 需要调整`n`n``````diff`n$out`n``````"
          } else {
            Write-Output "rustfmt 通过"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## rustfmt 通过"
          }
          exit 0

      - name: clippy
        shell: pwsh
        run: |
          $out = (cargo clippy --workspace --all-targets --message-format short 2>&1 | Out-String)
          Write-Output $out
          $warn = ($out -split "`n" | Where-Object { $_ -match '^(warning|error)' }).Count
          if ($warn -gt 0) {
            Write-Output "::warning title=clippy::clippy 报告了 $warn 条问题"
            $tail = ($out -split "`n" | Where-Object { $_ -match '^(warning|error)' } | Select-Object -First 100) -join "`n"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## clippy（$warn 条）`n`n``````n$tail`n``````"
          } else {
            Write-Output "clippy 通过"
          }
          exit 0
