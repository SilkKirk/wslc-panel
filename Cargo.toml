[workspace]
resolver = "2"
members = [
    "crates/wslc-core",
    "crates/wslc-db",
    "crates/wslc-panel",
    "crates/wslc-panel-core",
]

[workspace.package]
version = "0.19.0"
license = "Apache-2.0"
# 原先这里是空串。`publish = false` 所以不影响发布，但它是"关于"页与各种
# 工具读元数据的地方 —— 空着只会让人以为这个仓库没有来源。
# 改这个字段**不会**影响 `Cargo.lock`（锁文件不记录 repository），
# 所以 CI 的 `--locked` 不会因此报错。
repository = "https://github.com/SilkKirk/wslc-panel"
publish = false

[workspace.dependencies]
wslc-core = { path = "crates/wslc-core" }
wslc-panel-core = { path = "crates/wslc-panel-core" }
# 原生（进程内）数据库驱动。单独一个 crate 是因为驱动带 mysql / postgres
# 两棵依赖树，而 `wslc-core` 是纯数据层。见 `docs/PLAN-native-db.md`。
wslc-db = { path = "crates/wslc-db" }
# `tree-sitter-sql`：SQL 编辑器的**语法高亮**（v0.12）。
#
# 为什么值得多这 3 个依赖（`tree-sitter` + `tree-sitter-json` +
# `tree-sitter-sequel`，其中 `tree-sitter` 要编译 C 代码）：
#
# 控制台里那个输入框是用户写 SQL 的地方，之前是**单行** `Input` ——
# 稍微像样的查询都写不下，也看不出哪里是关键字。用户的原话是
# "右上面是一个输入的大框……可以参考 dbx"。
#
# 备选方案与代价（都实测核对过 gpui-kit v0.8.0 的源码）：
# - 只用 `Textarea`（多行、纯文本）：零新依赖，但**没有高亮**；
# - 用 `Editor` 但不开这个 feature：`language("sql")` 会落到纯文本配置，
#   同样没高亮；
# - 用 `syntect` backend（`gpui-kit` 的另一个 feature，约 200 种语言、
#   正则逐行匹配）：不建语法树，但依赖更重（`syntect` + `two-face` +
#   一整包 sublimelsp 语法），而我们**只需要一种语言**。
#
# 所以只挑 SQL 这一种 tree-sitter 语法。
gpui-kit = { version = "0.8.0", features = ["tree-sitter-sql"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# SQL 编辑器的**自动补全**要用到 LSP 的补全数据类型（v0.12.4）。
#
# 为什么必须直接依赖：`gpui-kit` 的 `CompletionProvider` trait 签名里就是
# `lsp_types::CompletionItem` / `CompletionResponse`，而它只 re-export 了
# `Position`（见 `component::input`），其余类型拿不到。
#
# 0.97.0 这个版本是**锁文件里已有的**（`gpui-base` 的传递依赖），
# 所以加它不会引入任何新 crate。
lsp-types = "0.97"

# GPUI 本身在 debug 下非常吃 CPU（每帧要跑布局 + 光栅化）。
# 下面的设置让"自己的代码"保持可调试的优化级别，同时把依赖编译到最高优化，
# 这是 Zed 官方推荐的开发配置，能显著改善 debug 构建下的交互流畅度。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# CI 专用。
#
# 上面那个 `opt-level = 3` 是给**本地跑界面**用的（GPUI 不优化就卡），
# 但 CI 从来不跑界面：它只做 `cargo check`（不产出机器码，opt-level 对它没意义）
# 和纯逻辑单测。让 CI 把整棵依赖树按最高优化 + 全量调试信息编一遍纯属浪费 ——
# 实测 `cargo test -p wslc-panel --bins` 那一步要 763 秒，就是这么来的。
#
# 只给**真的会 codegen** 的步骤用（`cargo test --profile ci`）。
# `cargo check` 不要加 `--profile ci`：白搭一份冷缓存，一点好处都没有。
[profile.ci]
inherits = "dev"
opt-level = 0
debug = 0
incremental = false

[profile.ci.package."*"]
opt-level = 0
debug = 0
